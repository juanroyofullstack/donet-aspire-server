name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore NetAspireServer.sln

      - name: Build solution
        run: dotnet build NetAspireServer.sln --configuration Release --no-restore

      - name: Run unit tests with coverage
        run: |
          rm -rf TestResults
          mkdir -p TestResults
          dotnet test tests/NetAspireServer.Application.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --settings coverlet.runsettings

      - name: Enforce minimum coverage
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage_files = sorted(Path('TestResults').rglob('coverage.cobertura.xml'))
          if not coverage_files:
              print('No coverage report found.')
              sys.exit(1)

          coverage_path = coverage_files[-1]
          root = ET.parse(coverage_path).getroot()
          line_rate = float(root.attrib.get('line-rate', '0'))
          print(f'Coverage report: {coverage_path}')
          print(f'Line coverage: {line_rate * 100:.2f}%')

          if line_rate < 0.90:
              print('Coverage is below the required 90%.')
              sys.exit(1)

          print('Coverage threshold met.')
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            TestResults
            tests/bin
            tests/obj

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start Cosmos emulator
        run: docker compose up -d cosmos

      - name: Run integration tests
        run: |
          dotnet restore NetAspireServer.sln
          dotnet test tests/NetAspireServer.IntegrationTests.csproj \
            --configuration Release \
            --no-restore \
            --logger "console;verbosity=minimal"
